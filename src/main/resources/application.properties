# =====================================================================
#  Configuracion de aplicacion - Sistema de Parqueo UMG
# =====================================================================
spring.application.name=parqueo-backend
server.port=8081
server.servlet.context-path=/api

# ----------------------- Base de datos -------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/parqueo_umg?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Brandonjom23?
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------- JPA / Hibernate -----------------------------
# 'validate' = no modifica la BD; usa los scripts SQL como fuente unica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------- JWT -----------------------------------------
# CAMBIAR esta clave en produccion. Minimo 32 caracteres (256 bits).
app.jwt.secret=ClaveSuperSecretaUMG2026ParqueoControlAccesoVehicular!!
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=umg-parqueo

# ----------------------- CORS ----------------------------------------
# Permite que el frontend React/Vite consuma la API
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ----------------------- Parqueo (reglas de negocio) -----------------
app.parqueo.qr.expiracion-segundos=300
app.parqueo.acceso.tiempo-respuesta-objetivo-ms=3000

# ----------------------- Swagger / OpenAPI ---------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ----------------------- Logging -------------------------------------
logging.level.root=INFO
logging.level.com.umg.parqueo=DEBUG
logging.level.org.springframework.security=INFO
